<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlinknPay - Registered Customers Dashboard</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header Section -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-indigo-600">BlinknPay Dashboard</h1>
                <p class="text-gray-600 mt-1">Registered Customers & Account Overview</p>
            </div>
            <div id="user-count" class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-full font-semibold text-sm">
                Loading users...
            </div>
        </header>

        <!-- Main Table Container -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">#</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Full Name</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Phone Number</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">User Number</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Registered Date</th>
                    </tr>
                </thead>
                <tbody id="user-table-body" class="divide-y divide-gray-200 bg-white">
                    <!-- Dynamic rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDKs (Modular v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBuUTCdsv83R8EgSSLUKtiWhCMpiJuRjto",
            authDomain: "blinknpay.firebaseapp.com",
            databaseURL: "https://blinknpay-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blinknpay",
            storageBucket: "blinknpay.firebasestorage.app",
            messagingSenderId: "358623370620",
            appId: "1:358623370620:web:9951ca49e4fdbcc66318f9",
            measurementId: "G-8GGMZB1T04"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const tableBody = document.getElementById('user-table-body');
        const userCountBadge = document.getElementById('user-count');

        // Query users ordered by creation date
        const q = query(collection(db, "users"), orderBy("createdAt", "desc"));

        // Real-time listener using Firestore v10 modular syntax
        onSnapshot(q, (snapshot) => {
            tableBody.innerHTML = "";
            userCountBadge.innerText = `${snapshot.size} Registered Users`;

            if (snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No registered customers found.</td></tr>`;
                return;
            }

            let rank = 1;
            snapshot.forEach((doc) => {
                const user = doc.data();
                
                // Format Firestore Timestamp to readable date string
                const regDate = user.createdAt ? new Date(user.createdAt.seconds * 1000).toLocaleString() : "N/A";
                const emailDisplay = user.email || "Not Provided";
                const statusBadge = user.isActive ? '<span class="text-green-600 font-semibold">Active</span>' : '<span class="text-red-600 font-semibold">Inactive</span>';

                // Main summary table row
                const row = document.createElement('tr');
                row.className = "hover:bg-indigo-50 cursor-pointer transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-500">${rank++}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">${user.fullName || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${user.phone || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">#${user.userNumber || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${regDate}</td>
                `;

                // Expandable details hidden row
                const detailRow = document.createElement('tr');
                detailRow.className = "hidden bg-gray-50 border-t border-b border-gray-200";
                detailRow.innerHTML = `
                    <td colspan="5" class="px-6 py-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-700 p-2 bg-white rounded border border-gray-200 shadow-inner">
                            <div><strong>UID:</strong> <span class="text-gray-500 font-mono text-xs">${user.uid}</span></div>
                            <div><strong>Email:</strong> ${emailDisplay}</div>
                            <div><strong>Account Status:</strong> ${statusBadge}</div>
                            <div><strong>PIN Hash:</strong> <span class="font-mono text-xs text-gray-500">${user.pinHash}</span></div>
                            <div><strong>Profile Image:</strong> ${user.profileImageUrl ? '<a href="'+user.profileImageUrl+'" target="_blank" class="text-indigo-600 underline">View</a>' : 'None'}</div>
                            <div><strong>Last Login:</strong> ${user.lastLoginAt ? new Date(user.lastLoginAt.seconds * 1000).toLocaleString() : 'N/A'}</div>
                        </div>
                    </td>
                `;

                // Toggle expandable drawer on click
                row.addEventListener('click', () => {
                    const isHidden = detailRow.classList.contains('hidden');
                    if (isHidden) {
                        detailRow.classList.remove('hidden');
                    } else {
                        detailRow.classList.add('hidden');
                    }
                });

                tableBody.appendChild(row);
                tableBody.appendChild(detailRow);
            });
        }, (error) => {
            console.error("Error fetching users: ", error);
            tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Failed to load user data. Check Firestore security rules.</td></tr>`;
        });
    </script>
</body>
</html>
